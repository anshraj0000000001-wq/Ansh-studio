<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ansh AI - Voice Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }
        .voice-card {
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .voice-card.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }
        .dancing-font {
            font-family: 'Dancing Script', cursive;
        }
        .gradient-text {
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .custom-loader {
            width: 20px;
            height: 20px;
            border: 3px solid #FFF;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Custom Scrollbar */
        #voice-grid::-webkit-scrollbar { width: 4px; }
        #voice-grid::-webkit-scrollbar-track { background: transparent; }
        #voice-grid::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-12">
            <h1 class="text-5xl md:text-7xl font-bold mb-4 gradient-text dancing-font">Ansh AI Voice Generator</h1>
            <p class="text-gray-400 text-lg">Give your words a premium voice - 10 Digital Characters</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-4">
                <h2 class="text-xl font-semibold mb-4 px-2">Select Character</h2>
                <div id="voice-grid" class="grid grid-cols-2 gap-3 max-h-[600px] overflow-y-auto pr-2">
                    </div>
            </div>

            <div class="lg:col-span-2">
                <div class="glass-card p-6 md:p-8 h-full flex flex-col">
                    <label class="block text-sm font-medium text-gray-400 mb-2">Write Your Text</label>
                    <textarea 
                        id="text-input" 
                        class="w-full h-64 bg-transparent border border-gray-700 rounded-xl p-4 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none resize-none text-lg transition-all"
                        placeholder="Type your message here..."
                    ></textarea>

                    <div class="mt-6 flex flex-col md:flex-row items-center justify-between gap-4">
                        <div id="status-tag" class="px-3 py-1 rounded-full bg-gray-800 text-xs text-gray-400 border border-gray-700">
                            System Ready
                        </div>
                        
                        <button 
                            id="generate-btn"
                            class="w-full md:w-auto px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-all transform active:scale-95 flex items-center justify-center gap-3 shadow-lg shadow-blue-900/20"
                        >
                            <span id="btn-text">Generate Voice</span>
                            <div id="btn-loader" class="custom-loader hidden"></div>
                        </button>
                    </div>

                    <div id="audio-container" class="mt-8 hidden">
                        <div class="flex items-center gap-2 mb-2 text-sm text-blue-400">
                            <span class="relative flex h-2 w-2">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
                            </span>
                            Audio Ready:
                        </div>
                        <audio id="audio-player" controls class="w-full"></audio>
                    </div>

                    <div id="error-box" class="mt-4 p-4 bg-red-900/20 border border-red-500/50 text-red-400 rounded-xl hidden"></div>
                </div>
            </div>
        </div>

        <footer class="mt-16 text-center text-gray-600 text-sm">
            &copy; AnshDeveloper - Developed by Ansh
        </footer>
    </div>

    <script>
        // API KEY LOADED
        const apiKey = "AIzaSyBpVYJkdkWMqUicvD1vTF3WMjbtxVT1nlg"; 
        let selectedVoice = "Kore";

        const voices = [
            { id: "Kore", name: "Kore", style: "Deep & Professional", color: "bg-blue-500" },
            { id: "Zephyr", name: "Zephyr", style: "Soft & Calm", color: "bg-teal-500" },
            { id: "Puck", name: "Puck", style: "Energetic & Fast", color: "bg-orange-500" },
            { id: "Charon", name: "Charon", style: "Authoritative", color: "bg-indigo-500" },
            { id: "Fenrir", name: "Fenrir", style: "Mysterious & Low", color: "bg-purple-500" },
            { id: "Leda", name: "Leda", style: "Warm & Friendly", color: "bg-pink-500" },
            { id: "Orus", name: "Orus", style: "Classic Narrator", color: "bg-yellow-500" },
            { id: "Aoede", name: "Aoede", style: "Melodic & Sweet", color: "bg-cyan-500" },
            { id: "Callirrhoe", name: "Callirrhoe", style: "Elegant", color: "bg-emerald-500" },
            { id: "Autonoe", name: "Autonoe", style: "Sophisticated", color: "bg-violet-500" }
        ];

        function initVoices() {
            const grid = document.getElementById('voice-grid');
            voices.forEach(voice => {
                const card = document.createElement('div');
                card.className = `voice-card glass-card p-4 flex flex-col items-center text-center ${voice.id === selectedVoice ? 'active' : ''}`;
                card.onclick = () => selectVoice(voice.id);
                card.innerHTML = `
                    <div class="w-12 h-12 rounded-full ${voice.color} mb-3 flex items-center justify-center font-bold text-white text-xl">
                        ${voice.name.charAt(0)}
                    </div>
                    <div class="font-semibold text-sm">${voice.name}</div>
                    <div class="text-[10px] text-gray-500 mt-1">${voice.style}</div>
                `;
                card.id = `voice-${voice.id}`;
                grid.appendChild(card);
            });
        }

        function selectVoice(id) {
            document.querySelectorAll('.voice-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`voice-${id}`).classList.add('active');
            selectedVoice = id;
        }

        async function generateVoice() {
            const textInput = document.getElementById('text-input').value.trim();
            const btn = document.getElementById('generate-btn');
            const btnText = document.getElementById('btn-text');
            const btnLoader = document.getElementById('btn-loader');
            const audioContainer = document.getElementById('audio-container');
            const errorBox = document.getElementById('error-box');
            const statusTag = document.getElementById('status-tag');

            if (!textInput) {
                showError("Please enter some text!");
                return;
            }

            btn.disabled = true;
            btnText.textContent = "Processing...";
            btnLoader.classList.remove('hidden');
            errorBox.classList.add('hidden');
            statusTag.textContent = "AI is speaking...";

            const payload = {
                contents: [{ parts: [{ text: textInput }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: { voiceName: selectedVoice }
                        }
                    }
                }
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("API Limit reached or Invalid Key");

                const data = await response.json();
                const audioData = data.candidates?.[0]?.content?.parts?.[0]?.inlineData;

                if (!audioData) throw new Error("Audio generation not supported for this text.");

                const audioUrl = `data:${audioData.mimeType};base64,${audioData.data}`;
                const player = document.getElementById('audio-player');
                player.src = audioUrl;
                audioContainer.classList.remove('hidden');
                statusTag.textContent = "Success!";
                player.play();

            } catch (err) {
                showError(err.message);
            } finally {
                btn.disabled = false;
                btnText.textContent = "Generate Voice";
                btnLoader.classList.add('hidden');
            }
        }

        function showError(msg) {
            const errorBox = document.getElementById('error-box');
            errorBox.textContent = msg;
            errorBox.classList.remove('hidden');
            document.getElementById('status-tag').textContent = "Failed";
        }

        window.onload = initVoices;
        document.getElementById('generate-btn').addEventListener('click', generateVoice);
    </script>
</body>
</html>
